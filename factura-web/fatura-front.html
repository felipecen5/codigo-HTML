<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Web</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor">
   <h1>Proyecto Factura Web</h1>
   <!-- datos personales : id / nombre / direccion / telefono / numero de factura / fecha / razon social -->
   <!-- datos de compra : cantidad de producto / valor por unidad / sub total -->
   <form action="" method="get">
    <input type="text" name="id" id="id" placeholder="ingrese su identificacion">
    <br>
    <br>
    <input type="text" name="nombre" id="nom" placeholder="ingrese su nombre">
    <br>
    <br>
    <input type="text" name="direccion" id="dir" placeholder="ingrese su direccion">
    <br>
    <br>
    <input type="text" name="telefono" id="tel" placeholder="ingrese su numero de telefono">
    <br>
    <br>
    <input type="text" name="numero de factura" id="num_factura" placeholder="ingrese el numero de factura">
    <br>
    <br>
    <input type="text" name="fecha" id="fh" placeholder="ingrese la fecha">
    <br>
    <br>
    <input type="text" name="razon social" id="rz" placeholder="ingrese la razon social">
    <br>
    <br>
    <input type="text" name="cantidad de producto" id="cp" placeholder="ingresa cantidad de producto ">
    <br>
    <br>
    <input type="text" name="valor por unidad" id="vu" placeholder="ingrese el valor por unidad">
    <br>
   </form>
   <br>
   <button type="button" onclick="buscar()">resultado</button>
   <br>
   <script src="back.js"></script>
    </div>
</body>
</html>
